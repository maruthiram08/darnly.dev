<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Artifacts | Test app</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 40px; }
  .grid { position: relative; display: grid; grid-template-columns: repeat(3, 240px); gap: 16px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; height: 100px; }
  /* Planted trap: a transparent layer over the whole grid, so the browser's own hit test only finds the grid. */
  .grid::after { content: ''; position: absolute; inset: 0; }
  .tag { font-size: 12px; color: #2563eb; }
</style></head>
<body>
  <h1>Artifacts</h1>
  <section class="grid">
    <article class="card" data-testid="card-1"><div class="tag">Beliefs</div>Pricing belief</article>
    <article class="card" data-testid="card-2"><div class="tag">Beliefs</div>Q3 plan (should be a Frame)</article>
    <article class="card" data-testid="card-3"><div class="tag">Frames</div>Launch frame</article>
  </section>
</body>
</html>
